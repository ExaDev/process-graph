packages:
  - "packages/core/*/*"
  - "packages/adapters/*/*"
  - "packages/ui/*/*"
  - "packages/targets/*"

# Four groups, each its own glob at its own real depth, ranked in eslint.shared.ts's workspaceArchitectureConfig call:
# - core/<domain>/<package>: the process model, its analysis and the ports; no knowledge of any adapter, UI or target.
# - adapters/<domain>/<package>: implementations of a core port against one external system.
# - ui/<domain>/<package>: components that render the model.
# - targets/<package>: deployable entry points, deliberately flat.

# Every private package names its siblings with `workspace:*` and its third-party libraries with `catalog:`, so a version is written once, in the catalog below, and nothing installs a sibling from the registry. The published `process-graph` package is the exception: `@semantic-release/npm` publishes with `npm publish`, which ships a `workspace:` or `catalog:` specifier verbatim, so its manifest names literal versions, which `scripts/check-published-manifests.ts` holds to the catalog and to each sibling's own version: exact and equal in `dependencies` and `devDependencies`, and in `peerDependencies` a caret range the catalog satisfies, or the exact catalog version for a prerelease. linkWorkspacePackages lets those exact sibling versions link the workspace copy rather than resolve from the registry.
linkWorkspacePackages: true

saveExact: true

# A decision recorded, not merely a permission granted: each entry names why that package's install script is safe to run.
allowBuilds:
  esbuild: true # ships a prebuilt native binary; a transitive dependency of vite and vitest

# Seven days, in minutes, matching the user-level install-age control. CI never reads the user-level config, so the workspace carries its own copy; never lower it.
minimumReleaseAge: 10080

# ExaDev's own published packages: the age gate guards against a compromised third-party maintainer publishing a malicious version before it is noticed, a threat model that does not apply to packages this organisation publishes itself through reviewed release pipelines.
minimumReleaseAgeExclude:
  - "@exadev/eslint-config"
  - "@exadev/json-compose"
  - "@exadev/semantic-release-workspace"
  - cosmiconfig-extends
  - eslint-plugin-json-canonical
  - trilean
  - trilean-regex

# One exact version per third-party library (and per ExaDev tool), referenced as `catalog:` from every private manifest. Add or bump an entry with `pnpm add --save-catalog <name>@<version>` in a private package; the install age gate above applies to every entry.
