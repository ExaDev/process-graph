name: Mutation testing

# Repo-wide, sharded mutation testing via Stryker, always a full run rather than an incremental one: see stryker.shared.ts for why incremental mode is unsafe with the vitest-runner plugin in use here. Each package is gated by its own stryker.config.ts break threshold (derived from a completed run's measured baseline; see stryker.shared.ts's breakThreshold), and the mutation-result job at the bottom aggregates the shards into the one stable check context a branch ruleset can require: the shard matrix's width varies per run, so no individual shard context can be required without stranding a run that produced fewer shards than a ruleset named by shard index.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: mutation-testing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan mutation shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-packages: ${{ steps.plan.outputs.has-packages }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compute weighted mutation shards
        id: plan
        run: node --experimental-strip-types .github/scripts/compute-mutation-shards.ts

  mutation-test:
    name: Mutation test (shard ${{ matrix.index }})
    needs: [plan]
    if: needs.plan.outputs.has-packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        env:
          SHARD_PACKAGES: ${{ matrix.packages }}
        with:
          task: mutation-shard-${{ matrix.index }}
          # Within a shard, packages run strictly sequentially (--concurrency=1): a standard GitHub-hosted runner has few cores, and Stryker layers its own subprocess pool on top of each package's own Vitest pool. Parallelism comes from separate shard jobs instead.
          command: |
            filters=()
            for pkg in $SHARD_PACKAGES; do
              filters+=("--filter=$pkg")
            done
            pnpm exec turbo run _test:mutation --concurrency=1 --continue=dependencies-successful "${filters[@]}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: mutation-report-shard-${{ matrix.index }}
          path: |
            packages/*/*/*/reports/mutation/mutation.html
            packages/*/reports/mutation/mutation.html
          if-no-files-found: ignore

  mutation-result:
    name: Mutation testing result
    needs: [plan, mutation-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate the shard outcomes into one conclusion
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          HAS_PACKAGES: ${{ needs.plan.outputs.has-packages }}
          MUTATION_RESULT: ${{ needs.mutation-test.result }}
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::Mutation shard planning failed; see the Plan mutation shards job."
            exit 1
          fi
          if [ "$HAS_PACKAGES" != "true" ]; then
            echo "No packages found; nothing to gate."
            exit 0
          fi
          if [ "$MUTATION_RESULT" != "success" ]; then
            echo "::error::One or more mutation shards failed: a package's score fell below its break threshold, or its run failed."
            exit 1
          fi
          echo "Every mutation shard succeeded."
